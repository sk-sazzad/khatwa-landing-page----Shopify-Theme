<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .bg-card { fill: url(#bg-grad); }
    .main-icon { animation: float 3s ease-in-out infinite, pulse 4s ease-in-out infinite; transform-origin: 32px 34px; fill: url(#icon-grad); }
    .star-accent { animation: spin-slow 7s linear infinite; transform-origin: 47px 17px; fill: url(#star-grad); }
    .dot-1 { animation: pulse 1.5s ease-in-out infinite alternate; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="18" class="bg-card" />

  <!-- Footprint / Shoe Icon -->
  <g class="main-icon">
    <!-- Outer Clog Shape -->
    <path d="M 17 37 C 17 24, 25 18, 36 18 C 45 18, 48 24, 48 33 C 48 42, 40 46, 30 46 C 20 46, 17 43, 17 37 Z"/>
    <!-- Ventilation Holes -->
    <circle cx="26" cy="27" r="1.8" fill="#2563eb"/>
    <circle cx="32" cy="25" r="1.8" fill="#2563eb"/>
    <circle cx="38" cy="27" r="1.8" fill="#2563eb"/>
    <circle cx="25" cy="34" r="1.6" fill="#2563eb"/>
    <circle cx="31" cy="33" r="1.6" fill="#2563eb"/>
    <circle cx="37" cy="34" r="1.6" fill="#2563eb"/>
    <!-- Heel Strap -->
    <path d="M 44 28 C 49 30, 49 38, 44 40" stroke="url(#icon-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Animated Rotating Star Accent -->
  <g class="star-accent">
    <path d="M 47 11 L 48.5 15.5 L 53 17 L 48.5 18.5 L 47 23 L 45.5 18.5 L 41 17 L 45.5 15.5 Z" />
  </g>

  <circle cx="15" cy="17" r="1.5" class="dot-1" fill="#fde047" />
</svg>
